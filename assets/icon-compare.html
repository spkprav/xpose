<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1C1C1E; display: flex; gap: 60px; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, sans-serif; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .label { color: #999; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
  .tag { color: #555; font-size: 10px; margin-top: -16px; }
  .sizes { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .row { display: flex; align-items: center; gap: 16px; }
</style>
</head>
<body>
  <div class="col">
    <div class="label">A — Soft matrix green</div>
    <div class="tag">#00AA33 · dark green bg · glow</div>
    <div class="sizes">
      <img src="icon-a.svg" width="256" height="256">
      <div class="row">
        <img src="icon-a.svg" width="128" height="128">
        <img src="icon-a.svg" width="64" height="64">
        <img src="icon-a.svg" width="32" height="32">
      </div>
    </div>
  </div>

  <div class="col">
    <div class="label">B — Deep navy / teal</div>
    <div class="tag">#5ECFDC · dark navy bg · glow</div>
    <div class="sizes">
      <img src="icon-b.svg" width="256" height="256">
      <div class="row">
        <img src="icon-b.svg" width="128" height="128">
        <img src="icon-b.svg" width="64" height="64">
        <img src="icon-b.svg" width="32" height="32">
      </div>
    </div>
  </div>
</body>
</html>
