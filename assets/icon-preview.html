<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #888; display: flex; gap: 32px; align-items: center; justify-content: center; min-height: 100vh; margin: 0; flex-wrap: wrap; }
  figure { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 0; }
  figcaption { color: #fff; font: 12px monospace; }
</style>
</head>
<body>
  <figure><img src="icon.svg" width="512" height="512"><figcaption>512</figcaption></figure>
  <figure><img src="icon.svg" width="256" height="256"><figcaption>256</figcaption></figure>
  <figure><img src="icon.svg" width="128" height="128"><figcaption>128</figcaption></figure>
  <figure><img src="icon.svg" width="64" height="64"><figcaption>64</figcaption></figure>
  <figure><img src="icon.svg" width="32" height="32"><figcaption>32</figcaption></figure>
  <figure><img src="icon.svg" width="16" height="16"><figcaption>16</figcaption></figure>
</body>
</html>
